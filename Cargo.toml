[package]
name = "oxideav-magicyuv"
version = "0.0.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-magicyuv"
authors = ["Mark Karpeles"]
description = "Pure-Rust MagicYUV lossless decoder for the oxideav framework"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-magicyuv"
keywords = ["multimedia", "video", "magicyuv", "lossless", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]

[features]
default = ["registry"]
# Wire the crate's `Decoder` impl + `register(ctx)` entry point into
# `oxideav-core`'s codec registry. Disable for standalone builds that
# want the decoder without dragging in the framework.
registry = ["dep:oxideav-core"]
# Emit a JSON-Lines trace tape during decode when the env var
# `OXIDEAV_MAGICYUV_TRACE_FILE` is set. Off by default; round-2
# Auditor uses this to do `jq`-line-diff lockstep against the
# Python reference codec's `--trace` output.
trace = []

[dependencies]
oxideav-core = { version = "0.1", optional = true }
