[package]
name = "oxideav-magicyuv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# MagicYUV's v7 frame decoder + encoder + the standalone Huffman
# sub-surface are all worth fuzzing.
#
# Decoder (`decode_magicyuv`): a 32-byte header (`spec/01` §3) selects
# one of 17 native FOURCCs (8/10/12/14-bit RGB / RGBA / YUV / YUVA /
# Gray), after which a `(N+1)`-entry u32 slice table, a per-slice
# preamble (plane count + plane-index bytes + the per-plane
# canonical-Huffman length descriptors of `spec/05` §2.0), and the
# per-slice payloads (raw or Huffman-coded residuals) are walked and
# run through the Left / Gradient / Median predictor inverse — Median
# being modular at 8-bit and standard JPEG-LS at 10/12/14-bit, with an
# optional interlaced field-stride and an RGB inter-plane decorrelation
# reversal. Feed arbitrary bytes to `decode_frame` and assert it
# always returns a `Result` rather than panicking / aborting /
# overflowing / indexing OOB / OOMing.
#
# Encoder (`encode_magicyuv`): drives `encode_frame(rec, w, h,
# slice_height, planes, options)` across the full parameter cube —
# 17 FOURCCs × 4 predictor strategies (Fixed{Left,Gradient,Median} +
# Dynamic) × 3 slice modes (Huffman/Raw/Auto) × interlaced on/off — and
# asserts (a) the encoder never panics on hostile inputs, (b) every
# `Ok(bytes)` round-trips through `decode_frame` byte-for-byte (the
# encoder is not allowed to emit syntactically-malformed bytes its own
# decoder rejects). There is no external library worth pulling in as a
# cross-decode oracle (and the clean-room wall bars any reference codec
# source anyway), so the round-trip *to our own decoder* is the
# correctness witness.
#
# Huffman descriptor (`huffman_descriptor`): pushes arbitrary bytes
# straight into the `huffman::parse_lengths` + `HuffmanTable::build`
# pair, bypassing the 32-byte header / slice-table / preamble framing
# the full-frame decoder walks first. Concentrates fuzz pressure on
# `spec/05` §1.1 run-length descriptor decode, `spec/05` §2.0
# canonical-Huffman code construction (the audit-corrected
# longest-length-first cumulative accumulator + Kraft check, with the
# `1u64 << len` cast at `len = max_length = 18` for the 14-bit tier),
# and the two-level primary/secondary table arithmetic
# (REDIRECT_MARKER, per-prefix subtable allocation, residual-bit
# spread). Successful builds then drive `decode_into_u{8,16}` on the
# trailing fuzz bytes so the post-build BitReader peek/consume hot
# loop sees pressure too.
#
# `default-features = false` keeps the framework registry (and its
# `oxideav-core` dependency) out of the fuzz binary — all three entry
# points are feature-independent.
[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-magicyuv]
path = ".."
default-features = false

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_magicyuv"
path = "fuzz_targets/decode_magicyuv.rs"
test = false
doc = false

[[bin]]
name = "encode_magicyuv"
path = "fuzz_targets/encode_magicyuv.rs"
test = false
doc = false

[[bin]]
name = "huffman_descriptor"
path = "fuzz_targets/huffman_descriptor.rs"
test = false
doc = false
