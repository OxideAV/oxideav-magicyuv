[package]
name = "oxideav-magicyuv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# MagicYUV's v7 frame decoder is the part worth fuzzing: a 32-byte
# header (`spec/01` §3) selects one of 17 native FOURCCs (8/10/12/14-bit
# RGB / RGBA / YUV / YUVA / Gray), after which a `(N+1)`-entry u32 slice
# table, a per-slice preamble (plane count + plane-index bytes + the
# per-plane canonical-Huffman length descriptors of `spec/05` §2.0), and
# the per-slice payloads (raw or Huffman-coded residuals) are walked and
# run through the Left / Gradient / Median predictor inverse — Median
# being modular at 8-bit and standard JPEG-LS at 10/12/14-bit, with an
# optional interlaced field-stride and an RGB inter-plane decorrelation
# reversal. There is no external library worth pulling in as a
# cross-decode oracle (and the clean-room wall bars any reference codec
# source anyway), so this fuzz crate is **decode-only**: feed arbitrary
# bytes to `decode_frame` and assert it always returns a `Result` rather
# than panicking / aborting / overflowing / indexing OOB / OOMing.
#
# `default-features = false` keeps the framework registry (and its
# `oxideav-core` dependency) out of the fuzz binary — the decoder entry
# point is feature-independent.
[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-magicyuv]
path = ".."
default-features = false

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_magicyuv"
path = "fuzz_targets/decode_magicyuv.rs"
test = false
doc = false
