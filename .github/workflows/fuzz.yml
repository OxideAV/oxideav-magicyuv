name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. Two targets
# are wired in: `decode_magicyuv` (the attacker-facing decoder — 32-byte
# header -> slice table -> preamble + per-plane canonical-Huffman
# descriptors -> raw / Huffman slice payloads -> Left / Gradient /
# Median predictor inverse, asserting decode never panics) and
# `encode_magicyuv` (drives the encoder across 17 FOURCCs × 4
# predictor strategies × 3 per-slice modes × interlaced on/off, then
# round-trips every Ok(bytes) through `decode_frame` byte-for-byte).
# The reusable workflow auto-discovers the targets under fuzz/ and
# splits the 1800-s total budget evenly across them.

on:
  schedule:
    - cron: "41 6 * * *"   # daily 06:41 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
